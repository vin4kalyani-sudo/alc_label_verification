<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title ?: 'Error'}">Error</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
  <div class="card empty">
    <h1 th:text="${status ?: 'Error'}">Error</h1>
    <h2 th:text="${title ?: error ?: 'Something went wrong'}">Something went wrong</h2>
    <p th:text="${message ?: 'Please try again.'}"></p>
    <p><a class="btn" th:href="@{/}">Back to dashboard</a></p>
  </div>
</main>
</body>
</html>
